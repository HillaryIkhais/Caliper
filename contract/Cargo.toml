[package]
name = "caliper"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.29", features = ["legacy", "unit-testing"] }
borsh = "0.10"
hex = "0.4"

[dev-dependencies]
ed25519-dalek = "2.2"
serde_json = "1"

[profile.release]
opt-level = 3
codegen-units = 1
